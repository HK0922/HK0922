<svg width="420" height="190" viewBox="0 0 420 190"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stats">
  <style>
    .bg { fill: #0d1117; }
    .border { fill: none; stroke: #30363d; stroke-width: 1; }
    .title { font-family: 'SubsetMonoBold','SubsetMono',monospace; font-size: 16px;
              fill: #c9d1d9; font-weight: 700; }
    .label { font-family: 'SubsetMono',monospace; font-size: 12px; fill: #8b949e; }
    .value { font-family: 'SubsetMonoBold','SubsetMono',monospace; font-size: 13px;
              fill: #c9d1d9; font-weight: 700; }
    @font-face{font-family:'SubsetMono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;}@font-face{font-family:'SubsetMonoBold';src:url(data:font/woff2;base64,) format('woff2');font-weight:700;}
  text{font-family:'SubsetMono',monospace;}</style>
  <rect class="bg" x="0.5" y="0.5" width="419" height="189" rx="6"/>
  <rect class="border" x="0.5" y="0.5" width="419" height="189" rx="6"/>
  <text x="20" y="30" class="title">Stats</text>
  <circle cx="24" cy="57" r="3" fill="#58a6ff"/>
  <text x="36" y="62" class="label">Total Stars</text>
  <text x="36" y="80" class="value">0</text>
  <circle cx="24" cy="95" r="3" fill="#3fb950"/>
  <text x="36" y="100" class="label">Total Repos</text>
  <text x="36" y="118" class="value">4</text>
  <circle cx="24" cy="133" r="3" fill="#58a6ff"/>
  <text x="36" y="138" class="label">Contributions (1y)</text>
  <text x="36" y="156" class="value">72</text>
  <circle cx="234" cy="57" r="3" fill="#3fb950"/>
  <text x="246" y="62" class="label">Current Streak</text>
  <text x="246" y="80" class="value">0 days</text>
  <circle cx="234" cy="95" r="3" fill="#58a6ff"/>
  <text x="246" y="100" class="label">Longest Streak</text>
  <text x="246" y="118" class="value">6 days</text>
  <circle cx="234" cy="133" r="3" fill="#3fb950"/>
  <text x="246" y="138" class="label">Followers</text>
  <text x="246" y="156" class="value">0</text>
</svg>
