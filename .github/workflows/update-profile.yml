name: Update Profile

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "assets/source_photo.jpg"
      - "*.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_github_data.py

      - name: Generate stats card
        run: python generate_stats_card.py

      - name: Generate languages card
        run: python generate_languages_card.py

      - name: Generate contribution calendar
        run: python generate_contribution_calendar.py

      - name: Generate ASCII portrait
        run: |
          if [ -f assets/source_photo.jpg ]; then
            python generate_ascii_portrait.py
          else
            echo "No assets/source_photo.jpg yet -- skipping portrait"
          fi

      - name: Commit changes if anything actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/generated data/github_stats.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update profile assets [skip ci]"
            git pull --rebase origin main
            git push
          fi
